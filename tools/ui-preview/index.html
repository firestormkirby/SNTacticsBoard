<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plugin UI preview</title>
    <style>
      /* Sidebar of choices beside a scaled device screen; stacks on a phone.
         The device screen stays white in both themes: it is e-ink. */
      :root {
        --bg: #f3f3f1;
        --panel: #ffffff;
        --line: #d6d6d2;
        --line-strong: #9a9a94;
        --ink: #161614;
        --on-ink: #ffffff;
        --dim: #686862;
        --code: #e9e9e5;
        --frame-edge: #c4c4be;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #121211; --panel: #1b1b19; --line: #33332f; --line-strong: #5d5d57;
          --ink: #ececE8; --on-ink: #121211; --dim: #a3a39c; --code: #2a2a27;
          --frame-edge: #4a4a45; color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #121211; --panel: #1b1b19; --line: #33332f; --line-strong: #5d5d57;
        --ink: #ececE8; --on-ink: #121211; --dim: #a3a39c; --code: #2a2a27;
        --frame-edge: #4a4a45; color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 14px/1.5 -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
        color: var(--ink);
        background: var(--bg);
        display: flex;
        overflow: hidden;
      }
      aside {
        width: 270px;
        flex: 0 0 270px;
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 18px 16px;
        overflow-y: auto;
      }
      h1 { font-size: 15px; margin: 0 0 2px; text-wrap: balance; }
      .sub { color: var(--dim); font-size: 12px; margin: 0 0 18px; }
      h2 {
        font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
        color: var(--dim); margin: 20px 0 8px;
      }
      .opt {
        display: block; width: 100%; text-align: left; cursor: pointer;
        background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
        padding: 8px 10px; margin-bottom: 6px; font: inherit; color: inherit;
        text-decoration: none;
      }
      .opt:hover { border-color: var(--line-strong); }
      .opt:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      .opt[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
      .opt small { display: block; font-size: 11px; opacity: .72; margin-top: 2px; line-height: 1.35; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; }
      .row .opt { width: auto; flex: 1 0 auto; text-align: center; }
      main {
        flex: 1; min-width: 0; overflow: auto; padding: 24px;
        display: flex; flex-direction: column; align-items: center; gap: 10px;
      }
      .frame-wrap { transform-origin: top left; flex: none; }
      iframe {
        border: 1px solid var(--frame-edge);
        box-shadow: 0 8px 28px rgba(0,0,0,.13);
        background: #fff;
        display: block;
      }
      .hint { color: var(--dim); font-size: 12px; max-width: 620px; text-align: center; }
      code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
      @media (max-width: 720px) {
        body { flex-direction: column; overflow: auto; height: auto; min-height: 100%; }
        aside {
          width: auto; flex: none; border-right: 0; border-bottom: 1px solid var(--line);
          padding: 14px 16px;
        }
        #scenarios, #devices { display: flex; flex-wrap: wrap; gap: 6px; }
        #scenarios .opt, #devices .opt { width: auto; margin: 0; }
        #scenarios .opt small, #devices .opt small { display: none; }
        main { padding: 16px; overflow: visible; min-height: 70vh; }
      }
    </style>
  </head>
  <body>
    <aside>
      <h1 id="title">Plugin UI preview</h1>
      <p class="sub">Your plugin's real UI, in a browser.</p>

      <h2>Scenario</h2>
      <div id="scenarios"></div>

      <h2>Device</h2>
      <div id="devices"></div>

      <h2>Zoom</h2>
      <div class="row" id="zooms"></div>

      <h2>Capture</h2>
      <button class="opt" id="reload">Reload the panel</button>
      <a class="opt" id="popout" href="device.html" target="_blank" rel="noopener">Open device view alone
        <small>Full size, no harness chrome. Screenshot this.</small>
      </a>
    </aside>

    <main>
      <div class="frame-wrap" id="wrap">
        <iframe id="device" title="Device screen"></iframe>
      </div>
      <p class="hint" id="hint"></p>
    </main>

    <script type="module" src="/src/harness.ts"></script>
  </body>
</html>
